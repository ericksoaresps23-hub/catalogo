<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Glauce Fashion - Catálogo Revista</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background: #0a0a0a;
        color: #f0f0f0;
        font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow: hidden;
    }

    .cover {
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: radial-gradient(circle at 30% 20%, #1a1a2e, #0a0a0a);
        cursor: pointer;
        position: relative;
        z-index: 5;
        transition: opacity 0.6s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        text-align: center;
    }

    .logo-wrapper {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 0.5rem;
        z-index: 10;
    }

    .logo-frame {
        width: 200px;
        height: 200px;
        border-radius: 50%;
        background: linear-gradient(135deg, rgba(230,194,122,0.2), rgba(230,194,122,0.05));
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        box-shadow: 0 0 0 3px rgba(230,194,122,0.6), 0 0 0 8px rgba(230,194,122,0.2), 0 10px 30px rgba(0,0,0,0.3);
    }

    .logo-frame::before {
        content: '';
        position: absolute;
        inset: -2px;
        border-radius: 50%;
        background: linear-gradient(135deg, #e6c27a, #d4af5a, #b8943e);
        z-index: -1;
        opacity: 0.7;
    }

    .logo-frame::after {
        content: '';
        position: absolute;
        inset: 3px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #1a1a2e, #0f0f1a);
        z-index: -1;
    }

    .logo-img {
        width: 160px;
        height: 160px;
        object-fit: contain;
        border-radius: 50%;
        filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
    }

    .cover h1 {
        font-size: clamp(2.5rem, 10vw, 4.8rem);
        background: linear-gradient(135deg, #FFF8E7, #E6C27A, #D4AF5A);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        letter-spacing: 4px;
        font-weight: 800;
        text-transform: uppercase;
        animation: pulseGlow 1.8s infinite alternate;
        margin-top: 0.5rem;
    }

    .cover .subtitle {
        font-size: 1rem;
        letter-spacing: 6px;
        font-weight: 300;
        color: #e6c27a;
        border-top: 1px solid rgba(230,194,122,0.5);
        padding-top: 1rem;
        width: 80%;
        max-width: 400px;
    }

    .cover-message {
        position: absolute;
        font-size: 0.9rem;
        background: rgba(230,194,122,0.15);
        padding: 10px 24px;
        border-radius: 40px;
        backdrop-filter: blur(8px);
        letter-spacing: 1px;
        color: #e6c27a;
        border: 1px solid rgba(230,194,122,0.3);
        animation: pulseMessage 2s infinite;
    }

    /* Desktop */
    .cover-message {
        bottom: 12%;
    }

    @keyframes pulseMessage {
        0% { opacity: 0.6; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); background: rgba(230,194,122,0.25);}
        100% { opacity: 0.6; transform: scale(1); }
    }

    @keyframes pulseGlow {
        0% { text-shadow: 0 0 0px rgba(230,194,122,0.2);}
        100% { text-shadow: 0 0 15px rgba(230,194,122,0.5);}
    }

    .book-container {
        position: relative;
        width: min(94vw, 1300px);
        height: 82vh;
        display: flex;
        justify-content: center;
        align-items: center;
        perspective: 2000px;
    }

    .book {
        width: 100%;
        height: 100%;
        display: none;
        position: relative;
        transform-style: preserve-3d;
    }

    .page {
        position: absolute;
        width: 50%;
        height: 100%;
        top: 0;
        backface-visibility: hidden;
        transform-style: preserve-3d;
        transition: transform 0.45s cubic-bezier(0.4, 0.0, 0.2, 1);
        box-shadow: 0 0 0 1px rgba(230,194,122,0.15);
    }

    .page-left {
        left: 0;
        transform-origin: right center;
        border-radius: 8px 0 0 8px;
        z-index: 2;
    }

    .page-right {
        right: 0;
        transform-origin: left center;
        border-radius: 0 8px 8px 0;
        z-index: 2;
    }

    .page-inner {
        width: 100%;
        height: 100%;
        background: #0c0c0c;
        overflow: hidden;
        border-radius: inherit;
        box-shadow: 0 20px 35px -12px rgba(0,0,0,0.6);
        cursor: pointer;
    }

    .page-inner img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #010101;
        display: block;
    }

    .page-right.flipping {
        transform: rotateY(-180deg);
        z-index: 10;
        box-shadow: -15px 0 30px rgba(0,0,0,0.5);
    }

    .page-left.flipping-back {
        transform: rotateY(180deg);
        z-index: 10;
        box-shadow: 15px 0 30px rgba(0,0,0,0.5);
    }

    .book::before {
        content: '';
        position: absolute;
        left: 50%;
        top: 0;
        width: 2px;
        height: 100%;
        background: linear-gradient(to right, rgba(230,194,122,0.2), rgba(230,194,122,0.6), rgba(230,194,122,0.2));
        transform: translateX(-50%);
        z-index: 20;
        pointer-events: none;
    }

    /* Controles - reposicionados para não ficar atrás dos botões sociais */
    .controls {
        position: fixed;
        bottom: 28px;
        left: 28px;
        display: flex;
        gap: 20px;
        z-index: 30;
        background: rgba(20,20,30,0.85);
        backdrop-filter: blur(12px);
        padding: 10px 25px;
        border-radius: 60px;
        border: 1px solid rgba(230,194,122,0.4);
    }

    button {
        background: #2a2a2e;
        border: none;
        font-size: 1rem;
        font-weight: bold;
        padding: 8px 24px;
        border-radius: 50px;
        color: #f5e7c8;
        cursor: pointer;
        transition: all 0.2s;
        font-family: inherit;
        display: inline-flex;
        align-items: center;
        gap: 6px;
    }

    button:hover {
        background: #3e3e48;
        transform: translateY(-2px);
    }

    .close-btn {
        position: fixed;
        top: 22px;
        right: 22px;
        background: #c72a2f;
        display: none;
        z-index: 40;
        padding: 8px 22px;
    }

    /* Botões redes sociais - lado direito */
    .social-buttons {
        position: fixed;
        bottom: 28px;
        right: 28px;
        display: flex;
        gap: 15px;
        z-index: 35;
    }

    .social-btn {
        background: rgba(0,0,0,0.7);
        backdrop-filter: blur(8px);
        color: white;
        padding: 12px 18px;
        border-radius: 50px;
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: bold;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.3s;
        box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        text-decoration: none;
        border: 1px solid rgba(255,255,255,0.2);
    }

    .whatsapp-btn {
        background: #25D366;
    }

    .whatsapp-btn:hover {
        background: #20b859;
        transform: scale(1.05);
    }

    .instagram-btn {
        background: radial-gradient(circle at 30% 110%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);
    }

    .instagram-btn:hover {
        transform: scale(1.05);
        opacity: 0.95;
    }

    .social-btn svg {
        width: 22px;
        height: 22px;
        fill: white;
    }

    /* Modal de zoom */
    .zoom-modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.98);
        backdrop-filter: blur(20px);
        display: none;
        z-index: 1000;
        flex-direction: column;
        overflow: hidden;
    }

    .zoom-header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        padding: 15px 20px;
        background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 1002;
        pointer-events: none;
    }

    .zoom-header span {
        background: rgba(0,0,0,0.6);
        padding: 6px 14px;
        border-radius: 30px;
        font-size: 12px;
        color: #e6c27a;
        backdrop-filter: blur(4px);
        pointer-events: none;
    }

    .zoom-close-btn {
        pointer-events: auto;
        background: rgba(199,42,47,0.9);
        border: none;
        color: white;
        padding: 8px 20px;
        border-radius: 30px;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.2s;
    }

    .zoom-close-btn:hover {
        background: #c72a2f;
    }

    .zoom-viewport {
        width: 100%;
        height: 100%;
        overflow: auto;
        -webkit-overflow-scrolling: touch;
        background: #000;
        cursor: grab;
    }

    .zoom-viewport:active {
        cursor: grabbing;
    }

    .zoom-wrapper {
        display: block;
        width: fit-content;
        height: fit-content;
        min-width: 100%;
        min-height: 100%;
    }

    .zoom-image {
        display: block;
        max-width: none;
        width: auto;
        height: auto;
        transform-origin: 0 0;
        will-change: transform;
        border-radius: 4px;
        box-shadow: 0 0 0 1px rgba(230,194,122,0.2);
        pointer-events: none;
    }

    .zoom-controls-bottom {
        position: fixed;
        bottom: 20px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        gap: 15px;
        z-index: 1002;
    }

    .zoom-control-btn {
        background: rgba(0,0,0,0.7);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(230,194,122,0.5);
        color: #e6c27a;
        padding: 10px 24px;
        border-radius: 40px;
        font-size: 0.9rem;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.2s;
    }

    .zoom-control-btn:hover {
        background: rgba(230,194,122,0.3);
        transform: scale(1.05);
    }

    @media (max-width: 768px) {
        .book-container { width: 90vw; perspective: 1200px; }
        .page { width: 100%; left: 0; transform-origin: left center; }
        .page-right { display: none; }
        .book::before { display: none; }
        
        /* Botões sociais no mobile */
        .social-buttons { 
            bottom: 28px; 
            right: 16px; 
            gap: 10px; 
        }
        .social-btn { 
            padding: 10px; 
            gap: 0; 
        }
        .social-btn span { display: none; }
        .social-btn svg { width: 20px; height: 20px; margin: 0; }
        
        /* Controles no mobile - lado esquerdo inferior */
        .controls { 
            bottom: 28px; 
            left: 16px; 
            gap: 12px; 
            padding: 6px 18px;
        }
        .controls button { 
            padding: 6px 16px; 
            font-size: 0.85rem; 
        }
        
        .logo-frame { width: 150px; height: 150px; }
        .logo-img { width: 120px; height: 120px; }
        
        /* Mensagem mais para cima no mobile */
        .cover-message {
            bottom: 18% !important;
            font-size: 0.8rem;
            padding: 8px 18px;
            white-space: nowrap;
        }
    }

    /* Ajuste para telas muito pequenas */
    @media (max-width: 480px) {
        .cover-message {
            bottom: 20% !important;
            font-size: 0.75rem;
            white-space: nowrap;
        }
        .controls button {
            padding: 4px 12px;
            font-size: 0.75rem;
        }
    }
</style>
</head>
<body>

<div id="cover" class="cover">
    <div class="logo-wrapper">
        <div class="logo-frame">
            <img id="companyLogo" class="logo-img" src="" alt="Logo Glauce Fashion">
        </div>
    </div>
    <h1>GLAUCE FASHION</h1>
    <div class="subtitle">EDIÇÃO ESPECIAL</div>
    <div class="cover-message">✨ toque em qualquer lugar para continuar ✨</div>
</div>

<button id="closeBtn" class="close-btn">✕ FECHAR</button>

<div class="book-container">
    <div id="book" class="book">
        <div id="pageLeft" class="page page-left">
            <div class="page-inner">
                <img id="leftImg" alt="página esquerda">
            </div>
        </div>
        <div id="pageRight" class="page page-right">
            <div class="page-inner">
                <img id="rightImg" alt="página direita">
            </div>
        </div>
    </div>
</div>

<div class="controls" id="controls" style="display:none;">
    <button id="prevBtn">◀ ANTERIOR</button>
    <button id="fullscreenBtn">⛶ TELA CHEIA</button>
    <button id="nextBtn">PRÓXIMA ▶</button>
</div>

<div class="social-buttons">
    <a id="instagramButton" class="social-btn instagram-btn" href="#" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zM12 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/>
        </svg>
        <span>INSTAGRAM</span>
    </a>
    <a id="whatsappButton" class="social-btn whatsapp-btn" href="#" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38c1.45.8 3.08 1.24 4.79 1.24 5.46 0 9.91-4.45 9.91-9.91S17.5 2 12.04 2zm.01 15.2c-1.48 0-2.93-.4-4.18-1.15l-.3-.18-3.11.82.83-3.03-.2-.31c-.8-1.28-1.22-2.76-1.22-4.28 0-4.54 3.7-8.24 8.24-8.24 4.54 0 8.24 3.7 8.24 8.24s-3.7 8.24-8.24 8.24zm4.52-6.17c-.25-.12-1.47-.73-1.7-.81-.23-.08-.4-.12-.56.12-.16.24-.64.81-.78.98-.14.17-.28.19-.52.07-.24-.12-1-.37-1.9-1.18-.7-.63-1.18-1.41-1.32-1.65-.14-.24-.02-.37.1-.49.11-.11.24-.28.36-.42.12-.14.16-.24.24-.4.08-.16.04-.3-.02-.42-.06-.12-.56-1.35-.77-1.85-.2-.5-.4-.43-.56-.44-.14-.01-.3-.01-.46-.01-.16 0-.42.06-.64.3-.22.24-.84.82-.84 2 0 1.18.86 2.32.98 2.48.12.16 1.69 2.58 4.1 3.62.57.25 1.02.4 1.37.51.57.18 1.09.15 1.5.09.46-.07 1.41-.58 1.61-1.14.2-.56.2-1.04.14-1.14-.06-.1-.22-.16-.47-.28z"/>
        </svg>
        <span>WHATSAPP</span>
    </a>
</div>

<div id="zoomModal" class="zoom-modal">
    <div class="zoom-header">
        <span>🔍 Use dois dedos para ampliar | Arraste para mover</span>
        <button id="zoomCloseModalBtn" class="zoom-close-btn">✕ FECHAR</button>
    </div>
    <div id="zoomViewport" class="zoom-viewport">
        <div id="zoomWrapper" class="zoom-wrapper">
            <img id="zoomImage" class="zoom-image" src="" alt="zoom">
        </div>
    </div>
    <div class="zoom-controls-bottom">
        <button id="zoomResetBtn" class="zoom-control-btn">⟲ RESETAR</button>
    </div>
</div>

<script>
    // ========== CONFIGURAÇÃO ==========
    const LOGO_PATH = "gf.jpeg";
    const DEFAULT_LOGO = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Cdefs%3E%3ClinearGradient id='grad' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' style='stop-color:%23e6c27a;stop-opacity:1' /%3E%3Cstop offset='100%25' style='stop-color:%23b8943e;stop-opacity:1' /%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='100' cy='100' r='95' fill='url(%23grad)' stroke='%23fff8e7' stroke-width='1.5' /%3E%3Ctext x='100' y='125' text-anchor='middle' font-family='Arial, sans-serif' font-size='48' font-weight='bold' fill='%231a1a2e' letter-spacing='2'%3EGF%3C/text%3E%3Ctext x='100' y='152' text-anchor='middle' font-family='Arial, sans-serif' font-size='14' font-weight='300' fill='%233d3520' letter-spacing='3'%3EFASHION%3C/text%3E%3C/svg%3E";
    
    // Redes sociais
    const WHATSAPP_NUMBER = "5548988230051";
    const WHATSAPP_MESSAGE = "Olá! Vi o catálogo Glauce Fashion e gostaria de mais informações!";
    const INSTAGRAM_URL = "https://www.instagram.com/glauce.fashion?igsh=MXBtbGZ1ZXV0YTVzaw==";
    
    // ========== SISTEMA DO LIVRO ==========
    const TOTAL_PHOTOS = 31;
    let currentIndex = 1;
    let isOpen = false;
    let isMobile = window.innerWidth <= 768;
    let isAnimating = false;
    let pendingNext = false;
    let pendingPrev = false;

    // Elementos
    const coverEl = document.getElementById('cover');
    const bookEl = document.getElementById('book');
    const controlsEl = document.getElementById('controls');
    const closeBtn = document.getElementById('closeBtn');
    const leftImg = document.getElementById('leftImg');
    const rightImg = document.getElementById('rightImg');
    const pageLeft = document.getElementById('pageLeft');
    const pageRight = document.getElementById('pageRight');
    const whatsappLink = document.getElementById('whatsappButton');
    const instagramLink = document.getElementById('instagramButton');
    const companyLogo = document.getElementById('companyLogo');
    
    // Zoom elementos
    const zoomModal = document.getElementById('zoomModal');
    const zoomViewport = document.getElementById('zoomViewport');
    const zoomWrapper = document.getElementById('zoomWrapper');
    const zoomImage = document.getElementById('zoomImage');
    const zoomResetBtn = document.getElementById('zoomResetBtn');
    const zoomCloseModalBtn = document.getElementById('zoomCloseModalBtn');
    
    let currentZoom = 1;
    
    function setupLogo() {
        companyLogo.src = LOGO_PATH && LOGO_PATH.trim() !== "" ? LOGO_PATH : DEFAULT_LOGO;
        companyLogo.addEventListener('error', () => { if (companyLogo.src !== DEFAULT_LOGO) companyLogo.src = DEFAULT_LOGO; });
    }
    setupLogo();
    
    // Configurar links sociais
    whatsappLink.href = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(WHATSAPP_MESSAGE)}`;
    instagramLink.href = INSTAGRAM_URL;
    
    function getImageUrl(pageNum) {
        return (pageNum >= 1 && pageNum <= TOTAL_PHOTOS) ? `img (${pageNum}).jpeg` : '';
    }
    
    function addFallback(imgEl) {
        imgEl.addEventListener('error', () => {
            if (!imgEl.src.includes('data:image')) {
                imgEl.src = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 4 3'%3E%3Crect width='100%25' height='100%25' fill='%23121212'/%3E%3Ctext x='0.5' y='1.6' font-size='0.25' fill='%23887755'%3E📷%3C/text%3E%3C/svg%3E";
            }
        });
    }
    addFallback(leftImg);
    addFallback(rightImg);
    
    function updatePageContent() {
        leftImg.src = getImageUrl(currentIndex);
        if (!isMobile) {
            const rightPageNum = currentIndex + 1;
            rightImg.src = (rightPageNum <= TOTAL_PHOTOS) ? getImageUrl(rightPageNum) : "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 2 2'%3E%3Crect width='2' height='2' fill='%23111111'/%3E%3C/svg%3E";
        }
    }
    
    // ========== ZOOM FLUIDO ==========
    function openZoomModal(imgSrc) {
        if (!imgSrc || imgSrc.includes('data:image/svg')) return;
        zoomImage.src = imgSrc;
        currentZoom = 1;
        zoomImage.style.transform = `scale(1)`;
        zoomModal.style.display = 'flex';
        document.body.style.overflow = 'hidden';
        
        setTimeout(() => {
            zoomViewport.scrollLeft = 0;
            zoomViewport.scrollTop = 0;
        }, 50);
    }
    
    function closeZoomModal() {
        zoomModal.style.display = 'none';
        zoomImage.src = '';
        document.body.style.overflow = '';
        currentZoom = 1;
    }
    
    function resetZoom() {
        currentZoom = 1;
        zoomImage.style.transform = `scale(1)`;
        zoomViewport.scrollLeft = 0;
        zoomViewport.scrollTop = 0;
    }
    
    // Configurar zoom fluido
    function setupZoomFeatures() {
        let initialDistance = 0;
        let initialZoom = 1;
        let initialScrollLeft = 0;
        let initialScrollTop = 0;
        let isPinching = false;
        
        zoomViewport.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                e.preventDefault();
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                initialDistance = Math.hypot(dx, dy);
                initialZoom = currentZoom;
                initialScrollLeft = zoomViewport.scrollLeft;
                initialScrollTop = zoomViewport.scrollTop;
                isPinching = true;
            }
        });
        
        zoomViewport.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && isPinching) {
                e.preventDefault();
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                const newDistance = Math.hypot(dx, dy);
                
                if (initialDistance > 0) {
                    let newZoom = initialZoom * (newDistance / initialDistance);
                    newZoom = Math.min(Math.max(newZoom, 0.8), 4);
                    
                    if (newZoom !== currentZoom) {
                        const currentCenterX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                        const currentCenterY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                        
                        const rect = zoomViewport.getBoundingClientRect();
                        const viewportX = currentCenterX - rect.left;
                        const viewportY = currentCenterY - rect.top;
                        
                        const pointX = (initialScrollLeft + viewportX) / initialZoom;
                        const pointY = (initialScrollTop + viewportY) / initialZoom;
                        
                        currentZoom = newZoom;
                        zoomImage.style.transform = `scale(${currentZoom})`;
                        
                        const newScrollLeft = pointX * currentZoom - viewportX;
                        const newScrollTop = pointY * currentZoom - viewportY;
                        
                        zoomViewport.scrollLeft = newScrollLeft;
                        zoomViewport.scrollTop = newScrollTop;
                        
                        initialScrollLeft = zoomViewport.scrollLeft;
                        initialScrollTop = zoomViewport.scrollTop;
                        initialZoom = currentZoom;
                        initialDistance = newDistance;
                    }
                }
            }
        });
        
        zoomViewport.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) {
                isPinching = false;
                initialDistance = 0;
            }
        });
        
        zoomViewport.addEventListener('wheel', (e) => {
            if (zoomModal.style.display === 'flex') {
                e.preventDefault();
                const delta = e.deltaY > 0 ? -0.1 : 0.1;
                const rect = zoomViewport.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;
                
                const oldScrollLeft = zoomViewport.scrollLeft;
                const oldScrollTop = zoomViewport.scrollTop;
                const pointX = (oldScrollLeft + mouseX) / currentZoom;
                const pointY = (oldScrollTop + mouseY) / currentZoom;
                
                let newZoom = currentZoom + delta;
                newZoom = Math.min(Math.max(newZoom, 0.8), 4);
                
                if (newZoom !== currentZoom) {
                    currentZoom = newZoom;
                    zoomImage.style.transform = `scale(${currentZoom})`;
                    
                    const newScrollLeft = pointX * currentZoom - mouseX;
                    const newScrollTop = pointY * currentZoom - mouseY;
                    
                    zoomViewport.scrollLeft = newScrollLeft;
                    zoomViewport.scrollTop = newScrollTop;
                }
            }
        });
        
        zoomResetBtn.addEventListener('click', resetZoom);
    }
    
    function handleImageClick(e) {
        if (!isOpen) return;
        const targetImg = e.target.closest('.page-inner')?.querySelector('img');
        if (targetImg && targetImg.src && !targetImg.src.includes('data:image/svg')) {
            e.stopPropagation();
            openZoomModal(targetImg.src);
        }
    }
    
    // ========== ANIMAÇÕES DO LIVRO ==========
    function animateNextPage() {
        if (isAnimating) return;
        let canProceed = isMobile ? (currentIndex < TOTAL_PHOTOS) : (currentIndex + 2 <= TOTAL_PHOTOS);
        if (!canProceed) { triggerEdgeEffect(); return; }
        isAnimating = true;
        if (isMobile) {
            const currentPageDiv = pageLeft;
            currentPageDiv.style.transition = 'transform 0.35s cubic-bezier(0.4, 0.0, 0.2, 1), opacity 0.2s';
            currentPageDiv.style.transform = 'rotateY(-95deg)';
            currentPageDiv.style.opacity = '0.5';
            setTimeout(() => {
                currentIndex++;
                updatePageContent();
                currentPageDiv.style.transform = '';
                currentPageDiv.style.opacity = '1';
                setTimeout(() => { isAnimating = false; if (pendingNext) { pendingNext = false; animateNextPage(); } }, 100);
            }, 200);
        } else {
            const newIndex = currentIndex + 2;
            pageRight.classList.add('flipping');
            setTimeout(() => {
                leftImg.src = getImageUrl(newIndex);
                const newRight = newIndex + 1;
                rightImg.src = (newRight <= TOTAL_PHOTOS) ? getImageUrl(newRight) : "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 2 2'%3E%3Crect width='2' height='2' fill='%23111111'/%3E%3C/svg%3E";
                currentIndex = newIndex;
            }, 220);
            setTimeout(() => { pageRight.classList.remove('flipping'); isAnimating = false; if (pendingNext) { pendingNext = false; animateNextPage(); } }, 480);
        }
    }
    
    function animatePrevPage() {
        if (isAnimating) return;
        if (currentIndex <= 1) { triggerEdgeEffect(); return; }
        isAnimating = true;
        if (isMobile) {
            const currentPageDiv = pageLeft;
            currentPageDiv.style.transition = 'transform 0.35s cubic-bezier(0.4, 0.0, 0.2, 1), opacity 0.2s';
            currentPageDiv.style.transform = 'rotateY(95deg)';
            currentPageDiv.style.opacity = '0.5';
            setTimeout(() => {
                currentIndex--;
                updatePageContent();
                currentPageDiv.style.transform = '';
                currentPageDiv.style.opacity = '1';
                setTimeout(() => { isAnimating = false; if (pendingPrev) { pendingPrev = false; animatePrevPage(); } }, 100);
            }, 200);
        } else {
            const newIndex = currentIndex - 2;
            if (newIndex < 1) {
                const finalIndex = 1;
                pageLeft.classList.add('flipping-back');
                setTimeout(() => {
                    leftImg.src = getImageUrl(finalIndex);
                    rightImg.src = (finalIndex + 1 <= TOTAL_PHOTOS) ? getImageUrl(finalIndex + 1) : "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 2 2'%3E%3Crect width='2' height='2' fill='%23111111'/%3E%3C/svg%3E";
                    currentIndex = finalIndex;
                }, 220);
                setTimeout(() => { pageLeft.classList.remove('flipping-back'); isAnimating = false; }, 480);
                return;
            }
            pageLeft.classList.add('flipping-back');
            setTimeout(() => {
                leftImg.src = getImageUrl(newIndex);
                rightImg.src = (newIndex + 1 <= TOTAL_PHOTOS) ? getImageUrl(newIndex + 1) : "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 2 2'%3E%3Crect width='2' height='2' fill='%23111111'/%3E%3C/svg%3E";
                currentIndex = newIndex;
            }, 220);
            setTimeout(() => { pageLeft.classList.remove('flipping-back'); isAnimating = false; }, 480);
        }
    }
    
    function triggerEdgeEffect() {
        const container = document.querySelector('.book-container');
        if (container) { container.style.transform = 'translateX(4px)'; setTimeout(() => { if(container) container.style.transform = ''; }, 120); }
    }
    
    function nextPage() { if (!isOpen || isAnimating) { if (isAnimating) pendingNext = true; return; } animateNextPage(); }
    function prevPage() { if (!isOpen || isAnimating) { if (isAnimating) pendingPrev = true; return; } animatePrevPage(); }
    
    function openBook() {
        if (isOpen) return;
        isOpen = true;
        currentIndex = 1;
        coverEl.style.opacity = '0';
        setTimeout(() => {
            coverEl.style.display = 'none';
            bookEl.style.display = 'block';
            controlsEl.style.display = 'flex';
            closeBtn.style.display = 'block';
            updatePageContent();
            pageLeft.classList.remove('flipping-back', 'flipping');
            isAnimating = false;
        }, 300);
    }
    
    function closeBook() {
        if (!isOpen) return;
        isOpen = false;
        bookEl.style.opacity = '0';
        setTimeout(() => {
            bookEl.style.display = 'none';
            controlsEl.style.display = 'none';
            closeBtn.style.display = 'none';
            coverEl.style.display = 'flex';
            coverEl.style.opacity = '1';
            bookEl.style.opacity = '1';
        }, 180);
    }
    
    function toggleFullscreen() {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
    }
    
    // Eventos
    coverEl.addEventListener('click', openBook);
    closeBtn.addEventListener('click', closeBook);
    prevBtn.addEventListener('click', prevPage);
    nextBtn.addEventListener('click', nextPage);
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    bookEl.addEventListener('click', handleImageClick);
    
    zoomCloseModalBtn.addEventListener('click', closeZoomModal);
    zoomModal.addEventListener('click', (e) => { if (e.target === zoomModal) closeZoomModal(); });
    
    document.addEventListener('keydown', (e) => {
        if (zoomModal.style.display === 'flex') {
            if (e.key === 'Escape') { closeZoomModal(); e.preventDefault(); }
            return;
        }
        if (!isOpen) { if (e.key === 'Enter' || e.key === 'ArrowRight') { openBook(); e.preventDefault(); } return; }
        if (e.key === 'ArrowRight') { nextPage(); e.preventDefault(); }
        else if (e.key === 'ArrowLeft') { prevPage(); e.preventDefault(); }
        else if (e.key === 'Escape') { closeBook(); e.preventDefault(); }
        else if (e.key === 'f' || e.key === 'F') { toggleFullscreen(); e.preventDefault(); }
    });
    
    let touchStartX = 0;
    bookEl.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; });
    bookEl.addEventListener('touchend', (e) => {
        const touchEndX = e.changedTouches[0].screenX;
        if (touchStartX - touchEndX > 50) nextPage();
        else if (touchEndX - touchStartX > 50) prevPage();
    });
    
    window.addEventListener('resize', () => {
        const wasMobile = isMobile;
        isMobile = window.innerWidth <= 768;
        if (isOpen && wasMobile !== isMobile) {
            if (!isMobile && pageRight) pageRight.style.display = 'block';
            else if (isMobile && pageRight) pageRight.style.display = 'none';
            updatePageContent();
        }
    });
    
    if (isMobile && pageRight) pageRight.style.display = 'none';
    else if (!isMobile && pageRight) pageRight.style.display = 'block';
    
    setupZoomFeatures();
    console.log("Catálogo com botões reposicionados - navegação à esquerda, redes sociais à direita!");
</script>
